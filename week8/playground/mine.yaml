apiVersion: apps/v1
kind: Deployment
metadata:
  name: mine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mine
  template:
    metadata:
      labels:
        app: mine
    spec:
      containers:
        - name: app
          image: ghcr.io/damirsovetbek008/inf345-project:8912399af52b3a6e2331c26d761f6f651fac69c0
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mine
spec:
  selector:
    app: mine
  ports:
    - port: 80
      targetPort: 8080
